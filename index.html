    <script>
      (function () {
        // Prevent @vite/client from throwing "WebSocket closed without opened" in environments where HMR is disabled
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var WrappedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var target = new EventTarget();
              target.url = String(url || '');
              target.protocol = 'vite-hmr';
              target.readyState = 1; // OPEN
              target.send = function () {};
              target.close = function () {
                target.readyState = 3; // CLOSED
              };
              setTimeout(function () {
                var openEvt = new Event('open');
                if (typeof target.onopen === 'function') target.onopen(openEvt);
                target.dispatchEvent(openEvt);
              }, 0);
              return target;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
          WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = WrappedWebSocket;
        }

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var msg = e && e.reason && (e.reason.message || String(e.reason));
            if (
              typeof msg === 'string' &&
              (msg.indexOf('WebSocket closed without opened') !== -1 ||
                msg.indexOf('failed to connect to websocket') !== -1)
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
